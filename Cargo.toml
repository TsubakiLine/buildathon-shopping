[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"

[dependencies]
arrow-array = "54"
arrow-schema = "54"
parquet = { version = "54", default-features = false, features = ["arrow"] }
memmap2 = "0.9"
memchr = "2.7"
hashbrown = "0.15"
mimalloc = { version = "0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true